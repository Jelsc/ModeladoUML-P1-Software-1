name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEPLOY_NETWORK: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_uml-generated
      DEPLOY_GATEWAY_PORT: ${DEPLOY_GATEWAY_PORT:-80}
      DEPLOY_GATEWAY_CONTAINER: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}-deploy-gateway
      DEPLOY_CREDENTIAL_SECRET: ${DEPLOY_CREDENTIAL_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy_build:/deploy-build
      - deploy_gateway_config:/deploy-gateway
      - whisper_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-8080}:5173"]
  frontend-production:
    profiles: [production]
    build: { context: ./frontend, dockerfile: Dockerfile }
    depends_on: [backend]
    ports: ["${PRODUCTION_FRONTEND_PORT:-8081}:80"]
  deploy-gateway:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}-deploy-gateway
    volumes:
      - deploy_gateway_config:/etc/nginx/conf.d:ro
    networks: [uml-generated]
    ports: ["${DEPLOY_GATEWAY_PORT:-80}:80"]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_postgres_data
  frontend_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_frontend_node_modules
  deploy_build:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_deploy_build
  deploy_gateway_config:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_deploy_gateway_config
  whisper_models:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_whisper_models
networks:
  uml-generated:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_uml-generated
