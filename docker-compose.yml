name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    environment: { TZ: America/La_Paz }
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-local}
      TIMEZONE: America/La_Paz
      TZ: America/La_Paz
      SEED_DEMO: ${SEED_DEMO:-true}
      DEPLOY_NETWORK: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_uml-generated
      DEPLOY_GATEWAY_PORT: ${DEPLOY_GATEWAY_PORT:-80}
      DEPLOY_GATEWAY_HTTPS_PORT: ${DEPLOY_GATEWAY_HTTPS_PORT:-443}
      DEPLOY_PUBLIC_SCHEME: ${DEPLOY_PUBLIC_SCHEME:-http}
      DEPLOY_PUBLIC_DOMAIN: ${DEPLOY_PUBLIC_DOMAIN:-localhost}
      CERTBOT_CERT_NAME: ${CERTBOT_CERT_NAME:-app-primerpacialsw.duckdns.org}
      DEPLOY_GATEWAY_CONTAINER: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}-deploy-gateway
      DEPLOY_CREDENTIAL_SECRET: ${DEPLOY_CREDENTIAL_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy_build:/deploy-build
      - deploy_gateway_config:/deploy-gateway
      - whisper_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-8080}:5173"]
  frontend-production:
    profiles: [production]
    build: { context: ./frontend, dockerfile: Dockerfile }
    depends_on: [backend]
    ports: ["${PRODUCTION_FRONTEND_PORT:-8081}:80"]
    networks: [default]
  deploy-gateway:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}-deploy-gateway
    volumes:
      - deploy_gateway_config:/etc/nginx/generated:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro
    networks: [default, uml-generated]
    ports:
      - "${DEPLOY_GATEWAY_PORT:-80}:80"
      - "${DEPLOY_GATEWAY_HTTPS_PORT:-443}:443"
    command:
      - /bin/sh
      - -c
      - >-
        if [ "$$APP_ENV" = "prod" ] || [ "$$APP_ENV" = "production" ] || [ "$$APP_ENV" = "vm" ]; then
        if [ -f /etc/letsencrypt/live/$$CERTBOT_CERT_NAME/fullchain.pem ] && [ -f /etc/letsencrypt/live/$$CERTBOT_CERT_NAME/privkey.pem ]; then
        envsubst '$$FRONTEND_DOMAIN $$API_DOMAIN $$CERTBOT_CERT_NAME' < /etc/nginx/templates/default.prod.conf.template > /etc/nginx/conf.d/default.conf;
        else envsubst '$$FRONTEND_DOMAIN $$API_DOMAIN' < /etc/nginx/templates/default.prod-bootstrap.conf.template > /etc/nginx/conf.d/default.conf; fi;
        else envsubst '$$API_DOMAIN' < /etc/nginx/templates/default.local.conf.template > /etc/nginx/conf.d/default.conf; fi && exec nginx -g "daemon off;"
    environment:
      APP_ENV: ${APP_ENV:-local}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-localhost}
      CERTBOT_CERT_NAME: ${CERTBOT_CERT_NAME:-app-primerpacialsw.duckdns.org}
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  certbot:
    image: certbot/certbot:latest
    profiles: [production]
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done'
    depends_on: [deploy-gateway]
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_postgres_data
  frontend_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_frontend_node_modules
  deploy_build:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_deploy_build
  deploy_gateway_config:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_deploy_gateway_config
  whisper_models:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_whisper_models
  certbot_data:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_certbot_data
  certbot_www:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_certbot_www
networks:
  uml-generated:
    name: ${COMPOSE_PROJECT_NAME:-primer-parcial-sw1}_uml-generated
